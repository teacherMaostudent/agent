[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-tool-gateway"
version = "0.1.0"
description = "Governed execution gateway for enterprise Agent tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-platform-sdk>=0.1.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp>=1.24,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../platform-sdk", "../platform-infra"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文方法职责使用全角标点；RUF002 会把正常中文逗号和分号误判为 ASCII 易混淆字符。
ignore = ["RUF002"]

[tool.ruff.format]
quote-style = "double"
