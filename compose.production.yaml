x-python-build: &python-build
  context: .

x-rag-env: &rag-env
  RAG_DEPLOYMENT_ENVIRONMENT: production
  RAG_PERSISTENCE: postgres
  RAG_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
  RAG_DATABASE_SCHEMA: rag_platform
  RAG_TEMPORAL_ENABLED: "true"
  RAG_TEMPORAL_TARGET: temporal:7233
  RAG_TEMPORAL_REGION_TARGETS: ${RAG_TEMPORAL_REGION_TARGETS:-}
  RAG_TEMPORAL_WORKER_REGION: ${RAG_TEMPORAL_WORKER_REGION:-}
  RAG_OBJECT_STORAGE_BACKEND: s3
  RAG_S3_BUCKET: ${DOCUMENT_BUCKET}
  RAG_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  RAG_S3_REGION: ${S3_REGION}
  RAG_S3_KMS_KEY_ID: ${S3_KMS_KEY_ID}
  RAG_SEARCH_BACKEND: opensearch
  # Hash 向量只用于本地契约测试；生产必须明确选择经过 Golden Retrieval 比较的 Provider。
  RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-local_openai}
  RAG_EMBEDDING_MODEL_REVISION: ${RAG_EMBEDDING_MODEL_REVISION}
  RAG_LOCAL_EMBEDDING_BASE_URL: ${RAG_LOCAL_EMBEDDING_BASE_URL}
  RAG_LOCAL_EMBEDDING_MODEL: ${RAG_LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
  RAG_LOCAL_EMBEDDING_DIMENSION: ${RAG_LOCAL_EMBEDDING_DIMENSION:-1024}
  RAG_EMBEDDING_ALLOW_HASH_FALLBACK: "false"
  RAG_OPENSEARCH_URL: http://opensearch:9200
  RAG_OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
  RAG_OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
  RAG_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  RAG_OIDC_ENABLED: "true"
  RAG_OIDC_ISSUER: ${OIDC_ISSUER}
  RAG_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
  RAG_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
  RAG_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
  RAG_WORKLOAD_CLIENT_ID: rag-platform
  RAG_WORKLOAD_CLIENT_SECRET: ${RAG_WORKLOAD_CLIENT_SECRET}
  RAG_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
  RAG_OPA_ENABLED: "true"
  RAG_OPA_BASE_URL: http://opa:8181
  RAG_RUNTIME_SNAPSHOT_REQUIRED: "true"
  RAG_REQUIRE_SERVICE_AUTH: "true"
  RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}
  RAG_INTERNAL_SERVICE_API_KEY: ${RAG_INTERNAL_SERVICE_API_KEY}
  RAG_MTLS_ENABLED: ${RAG_MTLS_ENABLED:-true}
  RAG_MTLS_CA_FILE: /run/secrets/agent_ca_pem
  RAG_CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
  RAG_CONTROL_PLANE_RUNTIME_KEY: ${CONTROL_PLANE_RUNTIME_API_KEY}
  RAG_GOVERNANCE_BASE_URL: https://agent-governance:8081
  RAG_GOVERNANCE_EVENT_KEY: ${GOVERNANCE_EVENT_INGESTION_KEY}
  RAG_GOVERNANCE_DELIVERY_MODE: cdc
  RAG_CONTEXT_SERVICE_BASE_URL: https://agent-context-service:8002
  RAG_RAG_QUERY_BASE_URL: https://rag-query-api:8003
  RAG_TOOL_GATEWAY_BASE_URL: https://tool-gateway:8090
  RAG_TOOL_GATEWAY_API_KEY: ${TOOL_GATEWAY_SERVICE_API_KEY}
  RAG_LLM_GATEWAY_BASE_URL: https://llm-gateway:8080
  RAG_LLM_GATEWAY_API_KEY: ${RAG_LLM_GATEWAY_API_KEY}
  RAG_ALLOW_LEGACY_PUBLIC_DOCUMENTS: "false"
  RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS}
  RAG_OTEL_ENABLED: "true"
  RAG_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces

x-rag-service: &rag-service
  build:
    <<: *python-build
    dockerfile: rag-agent-service/Dockerfile
    target: rag-query-api
  restart: unless-stopped
  environment: *rag-env
  secrets:
    - agent_ca_pem

x-runtime-env: &runtime-env
  # Runtime 不继承 RAG 环境锚点；所有执行边界以 RUNTIME_ 前缀独立审计。
  RUNTIME_ENVIRONMENT: production
  RUNTIME_PERSISTENCE: postgres
  RUNTIME_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
  RUNTIME_DATABASE_SCHEMA: runtime_platform
  # Session Ledger 归档与在线 PostgreSQL 分离；目标桶必须启用版本、KMS 和 Object Lock。
  RUNTIME_SESSION_ARCHIVE_ENABLED: "true"
  RUNTIME_SESSION_ARCHIVE_BUCKET: ${SESSION_ARCHIVE_BUCKET}
  RUNTIME_SESSION_ARCHIVE_PREFIX: runtime-session-ledger
  RUNTIME_SESSION_ARCHIVE_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  RUNTIME_SESSION_ARCHIVE_REGION: ${S3_REGION}
  RUNTIME_SESSION_ARCHIVE_KMS_KEY_ID: ${S3_KMS_KEY_ID}
  RUNTIME_SESSION_ARCHIVE_RETENTION_DAYS: ${SESSION_ARCHIVE_RETENTION_DAYS:-365}
  RUNTIME_SESSION_ARCHIVE_COMPLIANCE_MODE: "true"
  RUNTIME_TEMPORAL_ENABLED: "true"
  RUNTIME_TEMPORAL_TARGET: temporal:7233
  RUNTIME_TEMPORAL_REGION_TARGETS: ${RUNTIME_TEMPORAL_REGION_TARGETS:-}
  RUNTIME_TEMPORAL_WORKER_REGION: ${RUNTIME_TEMPORAL_WORKER_REGION:-}
  RUNTIME_TEMPORAL_GLOBAL_NAMESPACE_ENABLED: ${RUNTIME_TEMPORAL_GLOBAL_NAMESPACE_ENABLED:-false}
  RUNTIME_OIDC_ENABLED: "true"
  RUNTIME_OIDC_ISSUER: ${OIDC_ISSUER}
  RUNTIME_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
  RUNTIME_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
  RUNTIME_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
  RUNTIME_WORKLOAD_CLIENT_ID: agent-runtime
  RUNTIME_WORKLOAD_CLIENT_SECRET: ${RUNTIME_WORKLOAD_CLIENT_SECRET}
  RUNTIME_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
  RUNTIME_OPA_ENABLED: "true"
  RUNTIME_OPA_BASE_URL: http://opa:8181
  RUNTIME_SNAPSHOT_REQUIRED: "true"
  RUNTIME_EXECUTOR_CATALOG_VERSION: ${RUNTIME_EXECUTOR_CATALOG_VERSION:-runtime-executor-catalog/v1}
  RUNTIME_REQUIRE_SERVICE_AUTH: "true"
  RUNTIME_SERVICE_API_KEY: ${RUNTIME_SERVICE_API_KEY}
  RUNTIME_INTERNAL_SERVICE_API_KEY: ${RUNTIME_INTERNAL_SERVICE_API_KEY}
  RUNTIME_MTLS_ENABLED: ${RUNTIME_MTLS_ENABLED:-true}
  RUNTIME_MTLS_CA_FILE: /run/secrets/agent_ca_pem
  RUNTIME_CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
  RUNTIME_CONTROL_PLANE_RUNTIME_KEY: ${CONTROL_PLANE_RUNTIME_API_KEY}
  RUNTIME_GOVERNANCE_BASE_URL: https://agent-governance:8081
  RUNTIME_GOVERNANCE_EVENT_KEY: ${GOVERNANCE_EVENT_INGESTION_KEY}
  RUNTIME_GOVERNANCE_DELIVERY_MODE: cdc
  RUNTIME_CONTEXT_SERVICE_BASE_URL: https://agent-context-service:8002
  RUNTIME_RAG_QUERY_BASE_URL: https://rag-query-api:8003
  RUNTIME_INGESTION_BASE_URL: https://ingestion-api:8004
  RUNTIME_TOOL_GATEWAY_BASE_URL: https://tool-gateway:8090
  RUNTIME_TOOL_GATEWAY_API_KEY: ${TOOL_GATEWAY_SERVICE_API_KEY}
  RUNTIME_LLM_GATEWAY_BASE_URL: https://llm-gateway:8080
  RUNTIME_LLM_GATEWAY_API_KEY: ${RUNTIME_LLM_GATEWAY_API_KEY}

x-runtime-service: &runtime-service
  build:
    <<: *python-build
    dockerfile: agent-runtime/Dockerfile
  restart: unless-stopped
  environment: *runtime-env
  secrets:
    - agent_ca_pem
    - runtime_cert
    - runtime_key

secrets:
  agent_ca_pem:
    file: ${AGENT_MTLS_CA_FILE:-deploy/tls/agent-ca.pem}
  runtime_cert:
    file: ${RUNTIME_MTLS_CERT_FILE:-deploy/tls/agent-runtime.crt}
  runtime_key:
    file: ${RUNTIME_MTLS_KEY_FILE:-deploy/tls/agent-runtime.key}
  runtime_connector_relay_cert:
    file: ${RUNTIME_CONNECTOR_RELAY_MTLS_CERT_FILE:-deploy/tls/runtime-connector-relay.crt}
  runtime_connector_relay_key:
    file: ${RUNTIME_CONNECTOR_RELAY_MTLS_KEY_FILE:-deploy/tls/runtime-connector-relay.key}
  runtime_artifact_ingestion_relay_cert:
    file: ${RUNTIME_ARTIFACT_INGESTION_RELAY_MTLS_CERT_FILE:-deploy/tls/runtime-artifact-ingestion-relay.crt}
  runtime_artifact_ingestion_relay_key:
    file: ${RUNTIME_ARTIFACT_INGESTION_RELAY_MTLS_KEY_FILE:-deploy/tls/runtime-artifact-ingestion-relay.key}
  runtime_secondary_worker_cert:
    file: ${RUNTIME_SECONDARY_WORKER_MTLS_CERT_FILE:-deploy/tls/runtime-secondary-worker.crt}
  runtime_secondary_worker_key:
    file: ${RUNTIME_SECONDARY_WORKER_MTLS_KEY_FILE:-deploy/tls/runtime-secondary-worker.key}
  web_bff_cert:
    file: ${WEB_BFF_MTLS_CERT_FILE:-deploy/tls/agent-web-bff.crt}
  web_bff_key:
    file: ${WEB_BFF_MTLS_KEY_FILE:-deploy/tls/agent-web-bff.key}
  context_service_cert:
    file: ${CONTEXT_SERVICE_MTLS_CERT_FILE:-deploy/tls/agent-context-service.crt}
  context_service_key:
    file: ${CONTEXT_SERVICE_MTLS_KEY_FILE:-deploy/tls/agent-context-service.key}
  rag_query_cert:
    file: ${RAG_QUERY_MTLS_CERT_FILE:-deploy/tls/rag-query-api.crt}
  rag_query_key:
    file: ${RAG_QUERY_MTLS_KEY_FILE:-deploy/tls/rag-query-api.key}
  ingestion_api_cert:
    file: ${INGESTION_API_MTLS_CERT_FILE:-deploy/tls/ingestion-api.crt}
  ingestion_api_key:
    file: ${INGESTION_API_MTLS_KEY_FILE:-deploy/tls/ingestion-api.key}
  ingestion_worker_cert:
    file: ${INGESTION_WORKER_MTLS_CERT_FILE:-deploy/tls/ingestion-worker.crt}
  ingestion_worker_key:
    file: ${INGESTION_WORKER_MTLS_KEY_FILE:-deploy/tls/ingestion-worker.key}
  control_plane_cert:
    file: ${CONTROL_PLANE_MTLS_CERT_FILE:-deploy/tls/control-plane.crt}
  control_plane_key:
    file: ${CONTROL_PLANE_MTLS_KEY_FILE:-deploy/tls/control-plane.key}
  governance_cert:
    file: ${GOVERNANCE_MTLS_CERT_FILE:-deploy/tls/agent-governance.crt}
  governance_key:
    file: ${GOVERNANCE_MTLS_KEY_FILE:-deploy/tls/agent-governance.key}
  governance_worm_worker_cert:
    file: ${GOVERNANCE_WORM_WORKER_MTLS_CERT_FILE:-deploy/tls/governance-worm-worker.crt}
  governance_worm_worker_key:
    file: ${GOVERNANCE_WORM_WORKER_MTLS_KEY_FILE:-deploy/tls/governance-worm-worker.key}
  tool_gateway_cert:
    file: ${TOOL_GATEWAY_MTLS_CERT_FILE:-deploy/tls/tool-gateway.crt}
  tool_gateway_key:
    file: ${TOOL_GATEWAY_MTLS_KEY_FILE:-deploy/tls/tool-gateway.key}
  agent_lab_cert:
    file: ${AGENT_LAB_MTLS_CERT_FILE:-deploy/tls/agent-lab.crt}
  agent_lab_key:
    file: ${AGENT_LAB_MTLS_KEY_FILE:-deploy/tls/agent-lab.key}
  llm_gateway_cert:
    file: ${LLM_GATEWAY_MTLS_CERT_FILE:-deploy/tls/llm-gateway.crt}
  llm_gateway_key:
    file: ${LLM_GATEWAY_MTLS_KEY_FILE:-deploy/tls/llm-gateway.key}
  model_lab_cert:
    file: ${MODEL_LAB_MTLS_CERT_FILE:-deploy/tls/model-lab.crt}
  model_lab_key:
    file: ${MODEL_LAB_MTLS_KEY_FILE:-deploy/tls/model-lab.key}
  prometheus_cert:
    file: ${PROMETHEUS_MTLS_CERT_FILE:-deploy/tls/prometheus.crt}
  prometheus_key:
    file: ${PROMETHEUS_MTLS_KEY_FILE:-deploy/tls/prometheus.key}
  blackbox_exporter_cert:
    file: ${BLACKBOX_EXPORTER_MTLS_CERT_FILE:-deploy/tls/blackbox-exporter.crt}
  blackbox_exporter_key:
    file: ${BLACKBOX_EXPORTER_MTLS_KEY_FILE:-deploy/tls/blackbox-exporter.key}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_platform
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  kafka:
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafka-data:/var/lib/kafka/data]

  kafka-connect:
    image: ${DEBEZIUM_CONNECT_IMAGE}
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: agent-platform-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_INTERNAL_TOPIC_REPLICATION_FACTOR:-1}
      OFFSET_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_INTERNAL_TOPIC_REPLICATION_FACTOR:-1}
      STATUS_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_INTERNAL_TOPIC_REPLICATION_FACTOR:-1}
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on: [kafka, postgres]
    ports: ["8083:8083"]

  debezium-register:
    image: python:3.12-alpine
    restart: "no"
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      DEBEZIUM_CONFIG_PATH: /scripts/platform-outbox.json
      DEBEZIUM_REGISTER_TIMEOUT_SECONDS: ${DEBEZIUM_REGISTER_TIMEOUT_SECONDS:-120}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/debezium:/scripts:ro
    depends_on: [kafka-connect]

  temporal:
    image: ${TEMPORAL_IMAGE}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      DBNAME: temporal
    depends_on: [postgres]

  opensearch:
    image: ${OPENSEARCH_IMAGE}
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      plugins.security.ssl.http.enabled: "false"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    volumes: [opensearch-data:/usr/share/opensearch/data]

  opa:
    image: ${OPA_IMAGE}
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: [./deploy/opa:/policies:ro]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      OTEL_BACKEND_ENDPOINT: ${OTEL_BACKEND_ENDPOINT}
      OTEL_BACKEND_INSECURE: ${OTEL_BACKEND_INSECURE:-false}
    volumes: [./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro]

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    secrets: [agent_ca_pem, prometheus_cert, prometheus_key]
    depends_on: [otel-collector, blackbox-exporter, alertmanager]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--storage.path=/alertmanager"]
    volumes:
      # Replace this sample receiver file with a Secret-managed PagerDuty/WeCom/Slack
      # configuration before production cutover; routing/rules remain versioned here.
      - ${ALERTMANAGER_CONFIG_FILE:-./deploy/observability/alertmanager.yaml}:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE}
    command: ["--config.file=/etc/blackbox/blackbox.yaml"]
    volumes:
      - ./deploy/observability/blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    secrets: [agent_ca_pem, blackbox_exporter_cert, blackbox_exporter_key]

  model-lab:
    build:
      <<: *python-build
      dockerfile: model-lab/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_LAB_ENVIRONMENT: production
      MODEL_LAB_DATABASE_BACKEND: postgres
      MODEL_LAB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
      MODEL_LAB_DATABASE_SCHEMA: model_lab
      MODEL_LAB_ARTIFACT_BUCKET: ${MODEL_ARTIFACT_BUCKET}
      MODEL_LAB_SERVICE_API_KEY: ${MODEL_LAB_SERVICE_API_KEY}
      MODEL_LAB_OIDC_ENABLED: "true"
      MODEL_LAB_OIDC_ISSUER: ${OIDC_ISSUER}
      MODEL_LAB_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      MODEL_LAB_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      MODEL_LAB_MTLS_ENABLED: "true"
      MODEL_LAB_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      MODEL_LAB_MTLS_CERT_FILE: /run/secrets/model_lab_cert
      MODEL_LAB_MTLS_KEY_FILE: /run/secrets/model_lab_key
      PLATFORM_MTLS_SERVER_ENABLED: "true"
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/model_lab_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/model_lab_key
    secrets: [agent_ca_pem, model_lab_cert, model_lab_key]
    depends_on: [postgres]

  agent-lab:
    build:
      <<: *python-build
      dockerfile: agent-lab/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_LAB_ENVIRONMENT: production
      AGENT_LAB_DATABASE_BACKEND: postgres
      AGENT_LAB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
      AGENT_LAB_DATABASE_SCHEMA: agent_lab
      AGENT_LAB_CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
      AGENT_LAB_RUNTIME_BASE_URL: https://agent-runtime:8001
      AGENT_LAB_GOVERNANCE_BASE_URL: https://agent-governance:8081
      AGENT_LAB_CONTROL_PLANE_RUNTIME_KEY: ${CONTROL_PLANE_RUNTIME_API_KEY}
      AGENT_LAB_GOVERNANCE_AUDITOR_KEY: ${GOVERNANCE_AUDITOR_API_KEY}
      AGENT_LAB_SERVICE_API_KEY: ${AGENT_LAB_SERVICE_API_KEY}
      AGENT_LAB_TEMPORAL_ENABLED: "true"
      AGENT_LAB_TEMPORAL_TARGET: temporal:7233
      AGENT_LAB_TEMPORAL_TASK_QUEUE: ${AGENT_LAB_TEMPORAL_TASK_QUEUE:-agent-lab-experiments}
      AGENT_LAB_OIDC_ENABLED: "true"
      AGENT_LAB_OIDC_ISSUER: ${OIDC_ISSUER}
      AGENT_LAB_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      AGENT_LAB_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      AGENT_LAB_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
      AGENT_LAB_WORKLOAD_CLIENT_ID: agent-lab
      AGENT_LAB_WORKLOAD_CLIENT_SECRET: ${AGENT_LAB_WORKLOAD_CLIENT_SECRET}
      AGENT_LAB_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
      AGENT_LAB_MTLS_ENABLED: "true"
      AGENT_LAB_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      AGENT_LAB_MTLS_CERT_FILE: /run/secrets/agent_lab_cert
      AGENT_LAB_MTLS_KEY_FILE: /run/secrets/agent_lab_key
      # Production Sandbox cases fail closed until a dedicated MicroVM runner is installed.
      # Do not mount a Docker socket into either Agent Lab workload.
      AGENT_LAB_SANDBOX_PROVIDER: ${AGENT_LAB_SANDBOX_PROVIDER:-microvm}
      PLATFORM_MTLS_SERVER_ENABLED: "true"
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/agent_lab_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/agent_lab_key
    secrets: [agent_ca_pem, agent_lab_cert, agent_lab_key]
    depends_on: [postgres, temporal, agent-control-plane, agent-runtime, agent-governance]

  agent-lab-worker:
    extends:
      service: agent-lab
    command: agent-lab-temporal-worker
    depends_on: [agent-lab, temporal]

  agent-control-plane:
    build:
      <<: *python-build
      dockerfile: agent-control-plane/Dockerfile
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DATABASE_BACKEND: postgres
      CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
      CONTROL_PLANE_OIDC_ENABLED: "true"
      CONTROL_PLANE_OIDC_ISSUER: ${OIDC_ISSUER}
      CONTROL_PLANE_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      CONTROL_PLANE_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      CONTROL_PLANE_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
      CONTROL_PLANE_WORKLOAD_CLIENT_ID: agent-control-plane
      CONTROL_PLANE_WORKLOAD_CLIENT_SECRET: ${CONTROL_PLANE_WORKLOAD_CLIENT_SECRET}
      CONTROL_PLANE_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
      CONTROL_PLANE_MTLS_ENABLED: ${CONTROL_PLANE_MTLS_ENABLED:-true}
      CONTROL_PLANE_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      CONTROL_PLANE_MTLS_CERT_FILE: /run/secrets/control_plane_cert
      CONTROL_PLANE_MTLS_KEY_FILE: /run/secrets/control_plane_key
      CONTROL_PLANE_TEMPORAL_ENABLED: "true"
      CONTROL_PLANE_TEMPORAL_TARGET: temporal:7233
      CONTROL_PLANE_TOOL_CATALOG_REQUIRED: "true"
      CONTROL_PLANE_TOOL_CATALOG_PATH: /service/tool-catalog/tools.json
      CONTROL_PLANE_RUNTIME_EXECUTOR_CATALOG_PATH: /service/runtime-catalog/runtime-executors.json
      CONTROL_PLANE_RUNTIME_EXECUTOR_CATALOG_REQUIRED: "true"
      CONTROL_PLANE_RUNTIME_EXECUTOR_CATALOG_SERVICE_API_KEY: ${RUNTIME_SERVICE_API_KEY}
      CONTROL_PLANE_CONTRACTS_SCHEMA_DIR: /service/platform-contracts/schemas
      CONTROL_PLANE_AGENT_RELEASE_QUALITY_GATE_REQUIRED: "true"
      CONTROL_PLANE_ENFORCE_ADMIN_ROLE: "true"
      CONTROL_PLANE_ADMIN_API_KEY: ${CONTROL_PLANE_ADMIN_API_KEY}
      CONTROL_PLANE_RUNTIME_API_KEY: ${CONTROL_PLANE_RUNTIME_API_KEY}
      CONTROL_PLANE_GOVERNANCE_AUDITOR_API_KEY: ${GOVERNANCE_AUDITOR_API_KEY}
      CONTROL_PLANE_MODEL_LAB_BASE_URL: https://model-lab:8091
      CONTROL_PLANE_MODEL_LAB_REQUIRED: "true"
      CONTROL_PLANE_MODEL_LAB_SERVICE_API_KEY: ${MODEL_LAB_SERVICE_API_KEY}
      CONTROL_PLANE_AGENT_LAB_BASE_URL: https://agent-lab:8092
      CONTROL_PLANE_AGENT_LAB_SERVICE_API_KEY: ${AGENT_LAB_SERVICE_API_KEY}
      CONTROL_PLANE_AGENT_LAB_REQUIRED: "true"
      CONTROL_PLANE_LLM_GATEWAY_ADMIN_PASSWORD: ${LLM_ADMIN_PASSWORD}
      CONTROL_PLANE_LLM_GATEWAY_BASE_URL: https://llm-gateway:8080
      CONTROL_PLANE_LLM_QUOTA_SYNC_ENABLED: "true"
      CONTROL_PLANE_GOVERNANCE_BASE_URL: https://agent-governance:8081
      CONTROL_PLANE_OTEL_ENABLED: "true"
      CONTROL_PLANE_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      PLATFORM_MTLS_SERVER_ENABLED: "true"
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/control_plane_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/control_plane_key
    secrets:
      - agent_ca_pem
      - control_plane_cert
      - control_plane_key
    depends_on: [postgres, temporal, otel-collector]
    volumes:
      - ./agent-control-plane/config/tool-catalog.json:/service/tool-catalog/tools.json:ro
      - ./agent-control-plane/config/runtime-executors.json:/service/runtime-catalog/runtime-executors.json:ro
      - ./platform-contracts/schemas:/service/platform-contracts/schemas:ro

  control-plane-worker:
    extends:
      service: agent-control-plane
    command: control-plane-temporal-worker

  agent-governance:
    build:
      <<: *python-build
      dockerfile: agent-governance/Dockerfile
    environment:
      GOVERNANCE_ENVIRONMENT: production
      GOVERNANCE_DATABASE_BACKEND: postgres
      GOVERNANCE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
      GOVERNANCE_OIDC_ENABLED: "true"
      GOVERNANCE_OIDC_ISSUER: ${OIDC_ISSUER}
      GOVERNANCE_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      GOVERNANCE_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      GOVERNANCE_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
      GOVERNANCE_WORKLOAD_CLIENT_ID: agent-governance
      GOVERNANCE_WORKLOAD_CLIENT_SECRET: ${GOVERNANCE_WORKLOAD_CLIENT_SECRET}
      GOVERNANCE_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
      GOVERNANCE_MTLS_ENABLED: "true"
      GOVERNANCE_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      GOVERNANCE_MTLS_CERT_FILE: /run/secrets/governance_cert
      GOVERNANCE_MTLS_KEY_FILE: /run/secrets/governance_key
      GOVERNANCE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOVERNANCE_CDC_REQUIRED: "true"
      GOVERNANCE_WORM_BUCKET: ${AUDIT_BUCKET}
      GOVERNANCE_WORM_REGION: ${S3_REGION}
      GOVERNANCE_WORM_KMS_KEY_ID: ${WORM_KMS_KEY_ID}
      GOVERNANCE_WORM_SIGNING_MODE: kms
      GOVERNANCE_EVENT_INGESTION_KEY: ${GOVERNANCE_EVENT_INGESTION_KEY}
      GOVERNANCE_AUDITOR_API_KEY: ${GOVERNANCE_AUDITOR_API_KEY}
      GOVERNANCE_ENFORCE_AUDITOR_ROLE: "true"
      GOVERNANCE_ONLINE_TRACE_SAMPLE_RATE: ${GOVERNANCE_TRACE_SAMPLE_RATE:-0.1}
      GOVERNANCE_KAFKA_MAX_POLL_RECORDS: ${GOVERNANCE_KAFKA_MAX_POLL_RECORDS:-500}
      GOVERNANCE_KAFKA_RETRY_BACKOFF_MAX_SECONDS: ${GOVERNANCE_KAFKA_RETRY_BACKOFF_MAX_SECONDS:-60}
      GOVERNANCE_LLM_GATEWAY_API_KEY: ${GOVERNANCE_LLM_GATEWAY_API_KEY}
      GOVERNANCE_LLM_GATEWAY_BASE_URL: https://llm-gateway:8080
      GOVERNANCE_JUDGE_PRIMARY_MODEL_REVISION: ${GOVERNANCE_JUDGE_PRIMARY_MODEL_REVISION}
      GOVERNANCE_JUDGE_SECONDARY_MODEL_REVISION: ${GOVERNANCE_JUDGE_SECONDARY_MODEL_REVISION}
      GOVERNANCE_JUDGE_ARBITRATOR_MODEL_REVISION: ${GOVERNANCE_JUDGE_ARBITRATOR_MODEL_REVISION}
      GOVERNANCE_JUDGE_MODEL_ROUTE_VERSION: ${GOVERNANCE_JUDGE_MODEL_ROUTE_VERSION}
      GOVERNANCE_JUDGE_CALIBRATION_REQUIRED: "true"
      GOVERNANCE_OTEL_ENABLED: "true"
      GOVERNANCE_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      PLATFORM_MTLS_SERVER_ENABLED: "true"
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/governance_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/governance_key
    secrets: [agent_ca_pem, governance_cert, governance_key]
    depends_on: [postgres, kafka, otel-collector]
    volumes:
      - ./platform-contracts/schemas:/service/platform-contracts/schemas:ro

  governance-consumer:
    extends:
      service: agent-governance
    command: governance-kafka-consumer
    depends_on:
      debezium-register:
        condition: service_completed_successfully

  # This worker shares Governance's validated database, KMS, WORM and workload identity
  # configuration but owns no HTTP port. Scale it separately from API/consumer replicas.
  governance-worm-export-worker:
    extends:
      service: agent-governance
    command: governance-worm-export-worker
    environment:
      GOVERNANCE_WORKLOAD_CLIENT_ID: governance-worm-export-worker
      GOVERNANCE_WORKLOAD_CLIENT_SECRET: ${GOVERNANCE_WORM_WORKER_WORKLOAD_CLIENT_SECRET}
      GOVERNANCE_MTLS_CERT_FILE: /run/secrets/governance_worm_worker_cert
      GOVERNANCE_MTLS_KEY_FILE: /run/secrets/governance_worm_worker_key
      PLATFORM_MTLS_CERT_FILE: /run/secrets/governance_worm_worker_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/governance_worm_worker_key
    secrets:
      - agent_ca_pem
      - governance_worm_worker_cert
      - governance_worm_worker_key
    depends_on: [postgres, otel-collector]

  agent-runtime:
    <<: *runtime-service
    environment:
      <<: *runtime-env
      RUNTIME_MTLS_CERT_FILE: /run/secrets/runtime_cert
      RUNTIME_MTLS_KEY_FILE: /run/secrets/runtime_key
      PLATFORM_MTLS_SERVER_ENABLED: ${RUNTIME_MTLS_ENABLED:-true}
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/runtime_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/runtime_key
    depends_on: [postgres, temporal, redis, opa, otel-collector]

  runtime-worker:
    <<: *runtime-service
    command: runtime-temporal-worker
    depends_on: [agent-runtime, temporal]

  # Optional worker attached to the standby Temporal cluster but listening on the
  # same region queue. It is safe only with a replicated Global Namespace.
  runtime-worker-secondary:
    profiles: ["cross-region"]
    <<: *runtime-service
    command: runtime-temporal-worker
    environment:
      <<: *runtime-env
      RUNTIME_TEMPORAL_WORKER_TARGET_OVERRIDE: ${RUNTIME_TEMPORAL_SECONDARY_TARGET}
      RUNTIME_WORKLOAD_CLIENT_ID: runtime-worker-secondary
      RUNTIME_WORKLOAD_CLIENT_SECRET: ${RUNTIME_SECONDARY_WORKER_WORKLOAD_CLIENT_SECRET}
      RUNTIME_MTLS_CERT_FILE: /run/secrets/runtime_secondary_worker_cert
      RUNTIME_MTLS_KEY_FILE: /run/secrets/runtime_secondary_worker_key
    secrets:
      - agent_ca_pem
      - runtime_secondary_worker_cert
      - runtime_secondary_worker_key
    depends_on: [postgres]

  runtime-connector-artifact-relay:
    <<: *runtime-service
    command: runtime-connector-artifact-relay
    environment:
      <<: *runtime-env
      RUNTIME_WORKLOAD_CLIENT_ID: runtime-connector-artifact-relay
      RUNTIME_WORKLOAD_CLIENT_SECRET: ${RUNTIME_CONNECTOR_RELAY_WORKLOAD_CLIENT_SECRET}
      RUNTIME_MTLS_CERT_FILE: /run/secrets/runtime_connector_relay_cert
      RUNTIME_MTLS_KEY_FILE: /run/secrets/runtime_connector_relay_key
      RUNTIME_CONNECTOR_ARTIFACT_RELAY_POLL_SECONDS: ${RUNTIME_CONNECTOR_ARTIFACT_RELAY_POLL_SECONDS:-2}
      RUNTIME_CONNECTOR_ARTIFACT_RELAY_BATCH_SIZE: ${RUNTIME_CONNECTOR_ARTIFACT_RELAY_BATCH_SIZE:-20}
      RUNTIME_CONNECTOR_ARTIFACT_RELAY_MAX_ATTEMPTS: ${RUNTIME_CONNECTOR_ARTIFACT_RELAY_MAX_ATTEMPTS:-8}
    secrets:
      - agent_ca_pem
      - runtime_connector_relay_cert
      - runtime_connector_relay_key
    depends_on: [postgres, agent-context-service, agent-governance]

  runtime-artifact-ingestion-relay:
    <<: *runtime-service
    command: runtime-artifact-ingestion-relay
    environment:
      <<: *runtime-env
      RUNTIME_WORKLOAD_CLIENT_ID: runtime-artifact-ingestion-relay
      RUNTIME_WORKLOAD_CLIENT_SECRET: ${RUNTIME_ARTIFACT_INGESTION_RELAY_WORKLOAD_CLIENT_SECRET}
      RUNTIME_MTLS_CERT_FILE: /run/secrets/runtime_artifact_ingestion_relay_cert
      RUNTIME_MTLS_KEY_FILE: /run/secrets/runtime_artifact_ingestion_relay_key
    secrets:
      - agent_ca_pem
      - runtime_artifact_ingestion_relay_cert
      - runtime_artifact_ingestion_relay_key
    depends_on: [postgres, agent-context-service, ingestion-api, agent-governance]

  agent-web-bff:
    build:
      <<: *python-build
      dockerfile: agent-web-bff/Dockerfile
    restart: unless-stopped
    environment:
      WEB_BFF_ENVIRONMENT: production
      WEB_BFF_RUNTIME_BASE_URL: https://agent-runtime:8001/api/v1
      WEB_BFF_GOVERNANCE_BASE_URL: https://agent-governance:8081
      WEB_BFF_GOVERNANCE_AUDITOR_KEY: ${GOVERNANCE_AUDITOR_API_KEY}
      WEB_BFF_CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
      WEB_BFF_CONTROL_PLANE_ADMIN_KEY: ${CONTROL_PLANE_ADMIN_API_KEY}
      WEB_BFF_OIDC_ENABLED: "true"
      WEB_BFF_OIDC_ISSUER: ${OIDC_ISSUER}
      WEB_BFF_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      WEB_BFF_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      WEB_BFF_OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL}
      WEB_BFF_OIDC_TOKEN_URL: ${OIDC_TOKEN_URL}
      WEB_BFF_OIDC_END_SESSION_URL: ${WEB_BFF_OIDC_END_SESSION_URL}
      WEB_BFF_OIDC_CLIENT_ID: ${WEB_BFF_OIDC_CLIENT_ID}
      WEB_BFF_OIDC_CLIENT_SECRET: ${WEB_BFF_OIDC_CLIENT_SECRET:-}
      WEB_BFF_OIDC_REDIRECT_URI: ${WEB_BFF_OIDC_REDIRECT_URI}
      WEB_BFF_PUBLIC_ORIGIN: ${WEB_BFF_PUBLIC_ORIGIN}
      WEB_BFF_SESSION_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      WEB_BFF_CSRF_ENFORCED: "true"
      WEB_BFF_MTLS_ENABLED: "true"
      WEB_BFF_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      WEB_BFF_MTLS_CERT_FILE: /run/secrets/web_bff_cert
      WEB_BFF_MTLS_KEY_FILE: /run/secrets/web_bff_key
      WEB_BFF_CONSOLE_RUNTIME_HEALTH_URL: https://agent-runtime:8001/api/v1/health/ready
      WEB_BFF_CONSOLE_CONTROL_PLANE_HEALTH_URL: https://agent-control-plane:8080/health/ready
      WEB_BFF_CONSOLE_GOVERNANCE_HEALTH_URL: https://agent-governance:8081/health/ready
      WEB_BFF_CONSOLE_LLM_GATEWAY_HEALTH_URL: https://llm-gateway:8080/actuator/health
      WEB_BFF_CONSOLE_CONTEXT_HEALTH_URL: https://agent-context-service:8002/api/v1/health
      WEB_BFF_CONSOLE_RAG_HEALTH_URL: https://rag-query-api:8003/api/v1/health
      WEB_BFF_CONSOLE_INGESTION_HEALTH_URL: https://ingestion-api:8004/api/v1/health
      WEB_BFF_CONSOLE_TOOL_GATEWAY_HEALTH_URL: https://tool-gateway:8090/api/v1/health/ready
    secrets: [agent_ca_pem, web_bff_cert, web_bff_key]
    expose: ["8010"]
    depends_on: [redis, agent-runtime, agent-control-plane, agent-governance]

  agent-context-service:
    <<: *rag-service
    build:
      <<: *python-build
      dockerfile: rag-agent-service/Dockerfile
      target: context-service
    environment:
      <<: *rag-env
      RAG_WORKLOAD_CLIENT_ID: agent-context-service
      RAG_WORKLOAD_CLIENT_SECRET: ${CONTEXT_SERVICE_WORKLOAD_CLIENT_SECRET}
      RAG_MTLS_CERT_FILE: /run/secrets/context_service_cert
      RAG_MTLS_KEY_FILE: /run/secrets/context_service_key
      PLATFORM_MTLS_SERVER_ENABLED: ${RAG_MTLS_ENABLED:-true}
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/context_service_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/context_service_key
    secrets:
      - agent_ca_pem
      - context_service_cert
      - context_service_key

  rag-query-api:
    <<: *rag-service
    environment:
      <<: *rag-env
      RAG_WORKLOAD_CLIENT_ID: rag-query-api
      RAG_WORKLOAD_CLIENT_SECRET: ${RAG_QUERY_WORKLOAD_CLIENT_SECRET}
      RAG_MTLS_CERT_FILE: /run/secrets/rag_query_cert
      RAG_MTLS_KEY_FILE: /run/secrets/rag_query_key
      PLATFORM_MTLS_SERVER_ENABLED: ${RAG_MTLS_ENABLED:-true}
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/rag_query_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/rag_query_key
    secrets:
      - agent_ca_pem
      - rag_query_cert
      - rag_query_key
    depends_on: [opensearch]

  ingestion-api:
    <<: *rag-service
    build:
      <<: *python-build
      dockerfile: rag-agent-service/Dockerfile
      target: ingestion-api
    environment:
      <<: *rag-env
      RAG_WORKLOAD_CLIENT_ID: ingestion-api
      RAG_WORKLOAD_CLIENT_SECRET: ${INGESTION_API_WORKLOAD_CLIENT_SECRET}
      RAG_MTLS_CERT_FILE: /run/secrets/ingestion_api_cert
      RAG_MTLS_KEY_FILE: /run/secrets/ingestion_api_key
      PLATFORM_MTLS_SERVER_ENABLED: ${RAG_MTLS_ENABLED:-true}
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/ingestion_api_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/ingestion_api_key
    secrets:
      - agent_ca_pem
      - ingestion_api_cert
      - ingestion_api_key

  ingestion-worker:
    <<: *rag-service
    build:
      <<: *python-build
      dockerfile: rag-agent-service/Dockerfile
      target: ingestion-temporal-worker
    environment:
      <<: *rag-env
      RAG_WORKLOAD_CLIENT_ID: ingestion-worker
      RAG_WORKLOAD_CLIENT_SECRET: ${INGESTION_WORKER_WORKLOAD_CLIENT_SECRET}
      RAG_MTLS_CERT_FILE: /run/secrets/ingestion_worker_cert
      RAG_MTLS_KEY_FILE: /run/secrets/ingestion_worker_key
    secrets:
      - agent_ca_pem
      - ingestion_worker_cert
      - ingestion_worker_key
    depends_on: [temporal, opensearch]

  tool-gateway:
    build:
      <<: *python-build
      dockerfile: tool-gateway/Dockerfile
    environment:
      TOOL_GATEWAY_ENVIRONMENT: production
      TOOL_GATEWAY_DATABASE_BACKEND: postgres
      TOOL_GATEWAY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent_platform
      TOOL_GATEWAY_CATALOG_PROJECTION_MODE: control_plane
      TOOL_GATEWAY_CATALOG_PROJECTION_CACHE_PATH: /service/data/tool-runtime-projection.json
      TOOL_GATEWAY_CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
      TOOL_GATEWAY_CONTROL_PLANE_RUNTIME_API_KEY: ${CONTROL_PLANE_RUNTIME_API_KEY}
      TOOL_GATEWAY_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TOOL_GATEWAY_OIDC_ENABLED: "true"
      TOOL_GATEWAY_OIDC_ISSUER: ${OIDC_ISSUER}
      TOOL_GATEWAY_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      TOOL_GATEWAY_OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      TOOL_GATEWAY_WORKLOAD_TOKEN_URL: ${OIDC_TOKEN_URL}
      TOOL_GATEWAY_WORKLOAD_CLIENT_ID: tool-gateway
      TOOL_GATEWAY_WORKLOAD_CLIENT_SECRET: ${TOOL_GATEWAY_WORKLOAD_CLIENT_SECRET}
      TOOL_GATEWAY_WORKLOAD_AUDIENCE: ${OIDC_AUDIENCE}
      TOOL_GATEWAY_MTLS_ENABLED: ${TOOL_GATEWAY_MTLS_ENABLED:-true}
      TOOL_GATEWAY_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      TOOL_GATEWAY_MTLS_CERT_FILE: /run/secrets/tool_gateway_cert
      TOOL_GATEWAY_MTLS_KEY_FILE: /run/secrets/tool_gateway_key
      TOOL_GATEWAY_OPA_ENABLED: "true"
      TOOL_GATEWAY_OPA_BASE_URL: http://opa:8181
      TOOL_GATEWAY_SERVICE_API_KEY: ${TOOL_GATEWAY_SERVICE_API_KEY}
      RAG_INTERNAL_SERVICE_API_KEY: ${RAG_INTERNAL_SERVICE_API_KEY}
      TOOL_GATEWAY_ADMIN_API_KEY: ${TOOL_GATEWAY_ADMIN_API_KEY}
      TOOL_GATEWAY_ALLOW_PRIVATE_NETWORKS: "true"
      TOOL_GATEWAY_CONTRACTS_SCHEMA_DIR: /service/platform-contracts/schemas
      TOOL_GATEWAY_GOVERNANCE_BASE_URL: https://agent-governance:8081
      TOOL_GATEWAY_GOVERNANCE_EVENT_KEY: ${GOVERNANCE_EVENT_INGESTION_KEY}
      TOOL_GATEWAY_GOVERNANCE_DELIVERY_MODE: cdc
      PLATFORM_MTLS_SERVER_ENABLED: "true"
      PLATFORM_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_MTLS_CERT_FILE: /run/secrets/tool_gateway_cert
      PLATFORM_MTLS_KEY_FILE: /run/secrets/tool_gateway_key
      TOOL_GATEWAY_OTEL_ENABLED: "true"
      TOOL_GATEWAY_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
    secrets:
      - agent_ca_pem
      - tool_gateway_cert
      - tool_gateway_key
    depends_on: [postgres, redis, opa, rag-query-api, agent-control-plane]
    volumes:
      - ./platform-contracts/schemas:/service/platform-contracts/schemas:ro

  llm-gateway:
    build: ./llm-gateway
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/agent_platform
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GATEWAY_QUOTA_STORE: redis
      GATEWAY_ADMISSION_STORE: redis
      GATEWAY_ALLOW_ANONYMOUS: "false"
      GATEWAY_OIDC_ENABLED: "true"
      OIDC_ISSUER_URI: ${OIDC_ISSUER}
      GATEWAY_OPA_ENABLED: "true"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /run/secrets/llm_gateway_cert
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /run/secrets/llm_gateway_key
      SERVER_SSL_TRUST_CERTIFICATE: /run/secrets/agent_ca_pem
      SERVER_SSL_CLIENT_AUTH: need
      GATEWAY_OPA_BASE_URL: http://opa:8181
      ADMIN_SECURITY_ENABLED: "true"
      ADMIN_PASSWORD: ${LLM_ADMIN_PASSWORD}
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GOVERNANCE_BASE_URL: https://agent-governance:8081
      GOVERNANCE_AUDITOR_API_KEY: ${GOVERNANCE_AUDITOR_API_KEY}
      GOVERNANCE_EVENT_INGESTION_KEY: ${GOVERNANCE_EVENT_INGESTION_KEY}
      CONTROL_PLANE_BASE_URL: https://agent-control-plane:8080
      CONTROL_PLANE_ADMIN_API_KEY: ${CONTROL_PLANE_ADMIN_API_KEY}
      PLATFORM_SERVICES_MTLS_ENABLED: "true"
      PLATFORM_SERVICES_MTLS_CA_FILE: /run/secrets/agent_ca_pem
      PLATFORM_SERVICES_MTLS_CERT_FILE: /run/secrets/llm_gateway_cert
      PLATFORM_SERVICES_MTLS_KEY_FILE: /run/secrets/llm_gateway_key
      WORKLOAD_IDENTITY_TOKEN_URL: ${OIDC_TOKEN_URL}
      WORKLOAD_IDENTITY_CLIENT_ID: llm-gateway
      WORKLOAD_IDENTITY_CLIENT_SECRET: ${LLM_GATEWAY_WORKLOAD_CLIENT_SECRET}
      WORKLOAD_IDENTITY_AUDIENCE: ${OIDC_AUDIENCE}
    secrets: [agent_ca_pem, llm_gateway_cert, llm_gateway_key]
    depends_on: [postgres, redis, opa, otel-collector]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
  agent-lab-data:
  prometheus-data:
  alertmanager-data:
