[project]
name = "rag-agent-service"
version = "0.1.0"
description = "General-purpose RAG and Agent Runtime service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0,<5.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "rapidocr-onnxruntime>=1.4.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "temporalio>=1.18,<2.0",
    "opentelemetry-api>=1.30.0,<2.0.0",
    "opentelemetry-sdk>=1.30.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

rerank-local = [
    "sentence-transformers>=5.0.0,<6.0.0",
]

[project.scripts]
ingestion-worker = "apps.ingestion_worker.main:main"
ingestion-temporal-worker = "apps.ingestion_temporal_worker.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "apps*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释与面向中文业务人员的提示文本是产品文档的一部分；不将全角标点
# 误报为代码质量问题，其他 Ruff 规则仍保持严格执行。
# E501 is intentionally delegated to Ruff formatter; SQL/OpenSearch DSL and
# FastAPI signatures are less readable when manually wrapped. B008 is the
# framework-required FastAPI dependency declaration pattern.
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
