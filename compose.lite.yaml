services:
  aissuriq-compliance-lite:
    build:
      context: .
      dockerfile: rag-agent-service/Dockerfile.lite
    command: uvicorn apps.compliance_lite.main:app --host 0.0.0.0 --port 8000
    environment:
      COMPLIANCE_LITE_DATABASE_PATH: /service/data/compliance-lite.db
    ports:
      - "8000:8000"
    volumes:
      - compliance-lite-data:/service/data

volumes:
  compliance-lite-data:
