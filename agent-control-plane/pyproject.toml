[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Versioned configuration and release control plane for enterprise agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-platform-sdk>=0.1.0",
  "agent-platform-sdk>=0.1.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "temporalio>=1.18,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
control-plane-temporal-worker = "app.infrastructure.temporal_release:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../platform-sdk", "../platform-infra"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 服务源码采用中文职责说明；RUF002 将中文标点误判为易混淆 ASCII 字符。
ignore = ["RUF002"]

[tool.ruff.format]
quote-style = "double"
