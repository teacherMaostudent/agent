[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-platform-infra"
version = "0.1.0"
description = "Shared production infrastructure adapters for the agent platform."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "starlette>=0.40,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["platform_infra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF002 reports normal Chinese punctuation inside explanatory docstrings.
ignore = ["RUF002"]

[tool.ruff.format]
quote-style = "double"
