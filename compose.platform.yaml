# 完整本地联调拓扑：七个线上逻辑服务以独立工作负载运行；Context、RAG Query、摄取 API/Worker
# 共用 RAG 源码包但不共用进程。Model Lab、Agent Lab 是额外的离线实验服务。启动后可运行
# scripts/platform_e2e.py；生产边界与限制见 docs/deployment-guide.md。
x-rag-env: &rag-env
  RAG_DATA_DIR: /service/data
  RAG_PERSISTENCE: sqlite
  RAG_REQUIRE_SERVICE_AUTH: "true"
  RAG_SERVICE_API_KEY: local-rag-service-key
  RAG_INTERNAL_SERVICE_API_KEY: local-rag-service-key
  RAG_CORS_ORIGINS: '[]'
  RAG_LLM_ENABLED: "false"
  RAG_CONTEXT_SERVICE_BASE_URL: http://agent-context-service:8002
  RAG_RAG_QUERY_BASE_URL: http://rag-query-api:8003
  RAG_TOOL_GATEWAY_BASE_URL: http://tool-gateway:8090
  RAG_TOOL_GATEWAY_API_KEY: local-tool-gateway-key
  RAG_CONTROL_PLANE_BASE_URL: http://agent-control-plane:8080
  RAG_CONTROL_PLANE_RUNTIME_KEY: local-control-plane-key
  RAG_RUNTIME_SNAPSHOT_REQUIRED: "true"
  RAG_GOVERNANCE_BASE_URL: http://agent-governance:8081
  RAG_GOVERNANCE_EVENT_KEY: local-governance-key
  # 本地演示只把专用工作区作为固定 scope 以只读方式提供给 RAG Query。桌面端选择的
  # 任意目录仍只会变成有界清单，绝不会借此获得容器文件读取权限。
  RAG_SCAN_ROOTS: '{"workspace":"/workspace"}'

x-rag-service: &rag-service
  build:
    context: .
    dockerfile: rag-agent-service/Dockerfile
    target: rag-query-api
  restart: unless-stopped
  environment: *rag-env
  volumes:
    - rag-data:/service/data
    - ./demo-workspace:/workspace:ro

x-runtime-env: &runtime-env
  # Runtime 的配置与 RAG 进程彻底隔离：即使字段同名，也必须由 RUNTIME_ 显式声明。
  RUNTIME_ENVIRONMENT: local
  RUNTIME_DATA_DIR: /service/data
  RUNTIME_PERSISTENCE: sqlite
  # Schema Registry 是部署工件；显式路径避免 wheel 安装位置改变契约解析结果。
  RUNTIME_CONTRACTS_SCHEMA_DIR: /platform-contracts/schemas
  RUNTIME_REQUIRE_SERVICE_AUTH: "true"
  RUNTIME_SERVICE_API_KEY: local-runtime-service-key
  RUNTIME_INTERNAL_SERVICE_API_KEY: local-rag-service-key
  RUNTIME_CORS_ORIGINS: '[]'
  # 默认离线运行使无上游 Key 的首次部署仍可完成平台 E2E；在根目录 .env 显式设为
  # true 后才会调用外部模型，防止缺失凭证表现为不透明的 5xx。
  RUNTIME_LLM_ENABLED: ${RUNTIME_LLM_ENABLED:-false}
  # 启动时先检查 Gateway 可达性；供应商调用仍由每次请求的路由/预算/熔断器决定。
  RUNTIME_LLM_STARTUP_CHECK: ${RUNTIME_LLM_STARTUP_CHECK:-false}
  # 容器内 localhost 指向 Runtime 自身；必须使用 Compose 服务名访问独立 LLM Gateway。
  RUNTIME_LLM_GATEWAY_BASE_URL: http://llm-gateway:8080
  # Runtime 以 Gateway 已登记的本地服务凭据发起调用；它不是 DeepSeek 的上游 Key。
  # 生产环境应由 Secret 注入一个独立、最小权限的工作负载 Key，并在 Gateway 目录中登记。
  RUNTIME_LLM_GATEWAY_API_KEY: ${RUNTIME_LLM_GATEWAY_API_KEY:-runtime-service-key}
  RUNTIME_CONTEXT_SERVICE_BASE_URL: http://agent-context-service:8002
  RUNTIME_RAG_QUERY_BASE_URL: http://rag-query-api:8003
  RUNTIME_TOOL_GATEWAY_BASE_URL: http://tool-gateway:8090
  RUNTIME_TOOL_GATEWAY_API_KEY: local-tool-gateway-key
  RUNTIME_CONTROL_PLANE_BASE_URL: http://agent-control-plane:8080
  RUNTIME_CONTROL_PLANE_RUNTIME_KEY: local-control-plane-key
  RUNTIME_SNAPSHOT_REQUIRED: "true"
  RUNTIME_EXECUTOR_CATALOG_VERSION: runtime-executor-catalog/v1
  RUNTIME_GOVERNANCE_BASE_URL: http://agent-governance:8081
  RUNTIME_GOVERNANCE_EVENT_KEY: local-governance-key

x-runtime-service: &runtime-service
  build:
    context: .
    dockerfile: agent-runtime/Dockerfile
  restart: unless-stopped
  environment: *runtime-env
  volumes:
    - runtime-data:/service/data

services:
  agent-control-plane:
    build:
      context: .
      dockerfile: agent-control-plane/Dockerfile
    environment:
      CONTROL_PLANE_DATABASE_PATH: /data/control-plane.db
      CONTROL_PLANE_ENFORCE_ADMIN_ROLE: "true"
      CONTROL_PLANE_ADMIN_API_KEY: local-control-plane-admin-key
      CONTROL_PLANE_RUNTIME_API_KEY: local-control-plane-key
      CONTROL_PLANE_GOVERNANCE_AUDITOR_API_KEY: local-governance-auditor-key
      CONTROL_PLANE_LLM_GATEWAY_BASE_URL: http://llm-gateway:8080
      CONTROL_PLANE_GOVERNANCE_BASE_URL: http://agent-governance:8081
      CONTROL_PLANE_AGENT_LAB_BASE_URL: http://agent-lab:8092
      CONTROL_PLANE_AGENT_LAB_SERVICE_API_KEY: local-agent-lab-key
    # Windows/Hyper-V 经常动态保留 8xxx 端口段；宿主机使用 9002，容器内协议端口不变。
    ports: ["9002:8080"]
    volumes: ["control-plane-data:/data"]

  agent-governance:
    build:
      context: .
      dockerfile: agent-governance/Dockerfile
    environment:
      GOVERNANCE_DATABASE_PATH: /data/governance.db
      GOVERNANCE_ENFORCE_AUDITOR_ROLE: "true"
      GOVERNANCE_AUDITOR_API_KEY: local-governance-auditor-key
      GOVERNANCE_EVENT_INGESTION_KEY: local-governance-key
      GOVERNANCE_LLM_GATEWAY_BASE_URL: http://llm-gateway:8080
      GOVERNANCE_LLM_GATEWAY_API_KEY: governance-service-key
    ports: ["9001:8081"]
    volumes: ["governance-data:/data"]

  llm-gateway:
    build: ./llm-gateway
    # Key 只从未纳入版本控制的根目录 .env 或部署环境读取，不写入 Compose 或镜像层。
    env_file:
      # 本地首次启动可没有 .env；此时 Gateway 仍健康，但真实模型请求会因无凭证明确失败。
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/agent_platform
      DATABASE_USERNAME: platform
      DATABASE_PASSWORD: local-postgres-password
      REDIS_HOST: redis
      GATEWAY_QUOTA_STORE: redis
      GATEWAY_ADMISSION_STORE: redis
      GATEWAY_ALLOW_ANONYMOUS: "false"
      ADMIN_SECURITY_ENABLED: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      RAG_AGENT_API_KEY: local-rag-service-key
      GOVERNANCE_BASE_URL: http://agent-governance:8081
      CONTROL_PLANE_BASE_URL: http://agent-control-plane:8080
      CONTROL_PLANE_ADMIN_API_KEY: local-control-plane-admin-key
      GOVERNANCE_AUDITOR_API_KEY: local-governance-auditor-key
      GOVERNANCE_EVENT_INGESTION_KEY: local-governance-key
    ports: ["9000:8080"]
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  agent-runtime:
    <<: *runtime-service
    ports: ["8001:8001"]
    depends_on:
      llm-gateway:
        condition: service_healthy
      agent-control-plane:
        condition: service_started
      agent-governance:
        condition: service_started
      agent-context-service:
        condition: service_started
      tool-gateway:
        condition: service_started

  agent-context-service:
    <<: *rag-service
    build:
      context: .
      dockerfile: rag-agent-service/Dockerfile
      target: context-service
    ports: ["8002:8002"]
    depends_on: [rag-query-api]

  rag-query-api:
    <<: *rag-service
    ports: ["8003:8003"]

  ingestion-api:
    <<: *rag-service
    build:
      context: .
      dockerfile: rag-agent-service/Dockerfile
      target: ingestion-api
    ports: ["8004:8004"]

  ingestion-worker:
    <<: *rag-service
    build:
      context: .
      dockerfile: rag-agent-service/Dockerfile
      target: ingestion-worker
    depends_on: [ingestion-api]

  tool-gateway:
    build:
      context: .
      dockerfile: tool-gateway/Dockerfile
    environment:
      TOOL_GATEWAY_DATABASE_PATH: /service/data/tool-gateway.db
      TOOL_GATEWAY_TOOLS_CONFIG_PATH: /service/config/tools.json
      TOOL_GATEWAY_REQUIRE_SERVICE_AUTH: "true"
      TOOL_GATEWAY_SERVICE_API_KEY: local-tool-gateway-key
      TOOL_GATEWAY_ADMIN_API_KEY: local-tool-gateway-admin-key
      TOOL_GATEWAY_ALLOW_PRIVATE_NETWORKS: "true"
      RAG_INTERNAL_SERVICE_API_KEY: local-rag-service-key
      TOOL_GATEWAY_GOVERNANCE_BASE_URL: http://agent-governance:8081
      TOOL_GATEWAY_GOVERNANCE_EVENT_KEY: local-governance-key
    ports: ["9090:8090"]
    volumes: ["tool-gateway-data:/service/data"]
    depends_on: [agent-governance, ingestion-api]

  model-lab:
    build: ./model-lab
    restart: unless-stopped
    ports:
      - "9091:8091"

  agent-lab:
    build:
      context: .
      dockerfile: agent-lab/Dockerfile
    restart: unless-stopped
    environment:
      # 本地联调显式选择 SQLite/同步队列；生产模板会强制切换为 PostgreSQL + Temporal。
      AGENT_LAB_ENVIRONMENT: local
      AGENT_LAB_DATABASE_BACKEND: sqlite
      AGENT_LAB_DATABASE_PATH: /data/agent-lab.db
      AGENT_LAB_CONTROL_PLANE_BASE_URL: http://agent-control-plane:8080
      AGENT_LAB_RUNTIME_BASE_URL: http://agent-runtime:8001
      AGENT_LAB_GOVERNANCE_BASE_URL: http://agent-governance:8081
      AGENT_LAB_CONTROL_PLANE_RUNTIME_KEY: local-control-plane-key
      AGENT_LAB_GOVERNANCE_AUDITOR_KEY: local-governance-auditor-key
      AGENT_LAB_SERVICE_API_KEY: local-agent-lab-key
      AGENT_LAB_TEMPORAL_ENABLED: "false"
    ports:
      - "9092:8092"
    volumes: [agent-lab-data:/data]
    depends_on: [agent-control-plane, agent-runtime, agent-governance]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: agent_platform
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine

volumes:
  control-plane-data:
  governance-data:
  rag-data:
  runtime-data:
  tool-gateway-data:
  agent-lab-data:
  postgres-data:
