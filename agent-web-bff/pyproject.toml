[project]
name = "agent-web-bff"
version = "0.1.0"
description = "Same-origin web projection layer for the Agent Platform."
requires-python = ">=3.11"
dependencies = [
    "agent-platform-infra>=0.1.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["../platform-infra", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF002", "RUF003"]
